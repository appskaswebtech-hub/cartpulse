# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "203e48d916d039c8496ab10f7e87c778"
name = "CartPulse"
application_url = "https://cartpulse.kaswebtechsolutions.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/cart-activity/checkout-sync"
  topics = [ "checkouts/create", "checkouts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/cart/abandoned"
  topics = [ "checkouts/create", "checkouts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/cart-activity/added"
  topics = [ "carts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/cart-activity/order-sync"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_orders,write_app_proxy,write_products,write_script_tags"

[auth]
redirect_urls = [ "https://cartpulse.kaswebtechsolutions.com/auth/callback" ]

[app_proxy]
url = "https://cartpulse.kaswebtechsolutions.com/proxy"
subpath = "cartpulse"
prefix = "apps"
