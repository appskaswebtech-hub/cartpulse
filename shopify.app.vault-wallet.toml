# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "13ca252a64add7f7071c71e04c8a0692"
name = "Vault wallet"
application_url = "https://vaultwallet.kaswebtechsolutions.com"
embedded = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_draft_orders,read_orders,write_discounts,write_draft_orders,write_metaobject_definitions,write_metaobjects,write_orders,write_products"

[auth]
redirect_urls = [
  "https://vaultwallet.kaswebtechsolutions.com/auth/callback",
  "https://vaultwallet.kaswebtechsolutions.com/api/auth"
]

[app_proxy]
url = "https://vaultwallet.kaswebtechsolutions.com"
subpath = "vaultwallet"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
